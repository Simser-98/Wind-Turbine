<!DOCTYPE html>
<html>
<head>
    <title>Wind Turbine Suitability Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Wind Turbine Suitability Map</h1>

    <p>
        This map displays predicted wind turbine power output for different locations
        in the Netherlands. The colors represent relative suitability based on expected
        power output.
    </p>

    <div id="map"></div>

    <div class="legend">
        <p><span class="low"></span> Low predicted output</p>
        <p><span class="medium"></span> Medium predicted output</p>
        <p><span class="high"></span> High predicted output</p>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="map.js"></script>
</body>
</html>
